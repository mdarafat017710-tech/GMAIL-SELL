<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2FA Authenticator - iOS Style</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --text-main: #000000;
      --text-muted: #8e8e93;
      --border-color: #c6c6c8;
      --divider-color: #f0f0f3;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    .top-nav {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      position: relative;
      height: 36px;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      z-index: 10;
      padding: 4px 8px 4px 0;
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
    }

    .back-btn.show {
      display: flex;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.4px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .step-container {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .step-container.active {
      display: flex;
    }

    .info-box-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .box-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.2px;
      padding-left: 2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .ios-box {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
      user-select: text;
      -webkit-user-select: text;
    }

    .ios-box:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(0, 122, 255, 0.25), 0 2px 6px rgba(0, 122, 255, 0.1);
    }

    .ios-box.valid {
      border-color: var(--accent-green) !important;
      box-shadow: 0 0 10px rgba(52, 199, 89, 0.25), 0 2px 6px rgba(52, 199, 89, 0.1) !important;
    }

    .ios-box.invalid {
      border-color: var(--accent-red) !important;
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.25), 0 2px 6px rgba(255, 59, 48, 0.1) !important;
    }

    .input-indicator {
      position: absolute;
      right: 12px;
      width: 16px;
      height: 16px;
      background: var(--accent-green);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .input-indicator.show {
      display: flex;
    }

    .action-container {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
    }

    .btn-proceed {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
      transition: all 0.2s ease;
    }

    .btn-proceed:disabled {
      background: #c6c6c8;
      color: #8e8e93;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .ios-spinner {
      display: none;
      width: 18px;
      height: 18px;
      animation: iosRotate 0.8s steps(8, end) infinite;
    }

    @keyframes iosRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Result Card Style */
    .account-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      text-align: center;
      gap: 20px;
    }

    .totp-display-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 10px 0;
    }

    .totp-massive-value {
      font-size: 42px;
      font-weight: 800;
      font-family: monospace, var(--font-family);
      color: var(--accent-blue);
      letter-spacing: 4px;
    }

    .auth-timer-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .auth-timer-wrapper svg {
      transform: rotate(-90deg);
      width: 32px;
      height: 32px;
    }

    .auth-timer-bg { stroke: #c6c6c8; }
    .auth-timer-progress {
      stroke: var(--accent-blue);
      stroke-dasharray: 75.4;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .auth-timer-text {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-blue);
    }

    /* Big Copy Button with Blue Background */
    .btn-copy-action {
      background: var(--accent-blue);
      color: #ffffff;
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: background 0.3s ease;
    }

    .btn-copy-action.copied {
      background: var(--accent-green) !important;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.25) !important;
    }

    .copy-icon-circle {
      width: 22px;
      height: 22px;
      background: transparent;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .btn-copy-action.copied .copy-icon-circle {
      background: var(--accent-green);
    }

    /* Toast Popup */
    #copy-toast {
      position: fixed;
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      display: flex;
      align-items: center;
      white-space: nowrap;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: top 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    #copy-toast.show {
      top: 16px;
    }

    .toast-icon-wrapper {
      width: 16px;
      height: 16px;
      background: var(--accent-green);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Toast Notification Popup -->
  <div id="copy-toast">
    <div class="toast-icon-wrapper">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <span>Copied successfully!</span>
  </div>

  <div class="top-nav">
    <button class="back-btn" id="back-btn" onclick="goBackStep()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h1 class="header-title" id="main-title">2FA Code Generator</h1>
  </div>

  <!-- Step 1: Input 2FA Secret Key -->
  <div id="step-1" class="step-container active">
    <div class="info-box-group">
      <label class="box-label">Your 2FA Secret Code</label>
      <div class="input-wrapper">
        <input type="text" id="input-2fa" class="ios-box" placeholder="Enter 2FA Secret Code" oninput="validate2FAField()">
        <div class="input-indicator" id="2fa-indicator">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>
    <div class="action-container">
      <button class="btn-proceed" id="btn-1" disabled onclick="generateCodeAction()">
        <span id="btn-text-1">Proceed</span>
        <svg class="ios-spinner" id="spinner-1" viewBox="0 0 24 24">
          <line x1="12" y1="3" x2="12" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="1"/>
          <line x1="18.36" y1="5.64" x2="16.24" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.875"/>
          <line x1="21" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
          <line x1="18.36" y1="18.36" x2="16.24" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.625"/>
          <line x1="12" y1="21" x2="12" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="5.64" y1="18.36" x2="7.76" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.375"/>
          <line x1="3" y1="12" x2="6" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
          <line x1="5.64" y1="5.64" x2="7.76" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.125"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Step 2: Generated Code Result Page -->
  <div id="step-2" class="step-container">
    <div class="account-card" id="result-card-content"></div>
  </div>

  <script>
    const copyOutlineSVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const checkWhiteSVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    let secretKey = "";
    let isCodeGenerated = false;

    function showToast() {
      const toast = document.getElementById('copy-toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function copyCodeToClipboard(text, btnElement) {
      if (!text || text === "------") return;
      navigator.clipboard.writeText(text).then(() => {
        btnElement.classList.add('copied');
        const iconCircle = btnElement.querySelector('.copy-icon-circle');
        const textSpan = btnElement.querySelector('.copy-btn-text');
        if (iconCircle) iconCircle.innerHTML = checkWhiteSVG;
        if (textSpan) textSpan.innerText = "Copied";
        showToast();
        setTimeout(() => {
          btnElement.classList.remove('copied');
          if (iconCircle) iconCircle.innerHTML = copyOutlineSVG;
          if (textSpan) textSpan.innerText = "Copy";
        }, 2000);
      });
    }

    function validate2FAField() {
      const input = document.getElementById('input-2fa');
      const indicator = document.getElementById('2fa-indicator');
      const btn = document.getElementById('btn-1');
      const val = input.value.trim().toUpperCase();
      const cleanVal = val.replace(/[\s]/g, '');
      const base32Regex = /^[A-Z2-7]+$/;

      if (cleanVal.length >= 16 && base32Regex.test(cleanVal)) {
        input.classList.remove('invalid');
        input.classList.add('valid');
        indicator.classList.add('show');
        btn.disabled = false;
      } else {
        if (val.length > 0) {
          input.classList.remove('valid');
          input.classList.add('invalid');
        } else {
          input.classList.remove('valid', 'invalid');
        }
        indicator.classList.remove('show');
        btn.disabled = true;
      }
    }

    function generateCodeAction() {
      secretKey = document.getElementById('input-2fa').value.trim().toUpperCase();

      const btnText = document.getElementById('btn-text-1');
      const spinner = document.getElementById('spinner-1');
      const btn = document.getElementById('btn-1');

      btnText.style.display = 'none';
      spinner.style.display = 'inline-block';
      btn.disabled = true;

      setTimeout(() => {
        spinner.style.display = 'none';
        btnText.style.display = 'inline';
        btn.disabled = false;
        buildResultCard();
      }, 1000);
    }

    function goBackStep() {
      document.getElementById('step-2').classList.remove('active');
      document.getElementById('step-1').classList.add('active');
      document.getElementById('back-btn').classList.remove('show');
      document.getElementById('main-title').innerText = "2FA Code Generator";
      isCodeGenerated = false;
    }

    async function generateTOTP(secretBase32) {
      try {
        if (!secretBase32) return "------";
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        let cleaned = secretBase32.replace(/[\s=]/g, "").toUpperCase();
        let bits = "";
        for (let i = 0; i < cleaned.length; i++) {
          let val = alphabet.indexOf(cleaned[i]);
          if (val === -1) continue;
          bits += val.toString(2).padStart(5, '0');
        }
        let bytes = new Uint8Array(Math.floor(bits.length / 8));
        for (let i = 0; i < bytes.length; i++) {
          bytes[i] = parseInt(bits.substr(i * 8, 8), 2);
        }
        if (bytes.length === 0) return "------";
        const epoch = Math.floor(Date.now() / 1000);
        const counter = Math.floor(epoch / 30);
        const buffer = new ArrayBuffer(8);
        const view = new DataView(buffer);
        view.setUint32(4, counter, false);
        const cryptoKey = await window.crypto.subtle.importKey(
          "raw", bytes, { name: "HMAC", hash: { name: "SHA-1" } }, false, ["sign"]
        );
        const signature = await window.crypto.subtle.sign("HMAC", cryptoKey, buffer);
        const sigBytes = new Uint8Array(signature);
        const offset = sigBytes[sigBytes.length - 1] & 0x0f;
        const binary =
          ((sigBytes[offset] & 0x7f) << 24) |
          ((sigBytes[offset + 1] & 0xff) << 16) |
          ((sigBytes[offset + 2] & 0xff) << 8) |
          (sigBytes[offset + 3] & 0xff);
        const otp = binary % 1000000;
        return otp.toString().padStart(6, '0');
      } catch (e) {
        return "------";
      }
    }

    let totpValEl = null;
    let timerEl = null;
    let ringProgressEl = null;
    let copyBtnEl = null;

    async function updateTOTPLive() {
      const remainingSeconds = 30 - (Math.floor(Date.now() / 1000) % 30);
      const circumference = 75.4; // 2 * pi * r (r=12)
      const offset = circumference - (remainingSeconds / 30) * circumference;

      if (timerEl) timerEl.innerText = `${remainingSeconds}`;
      if (ringProgressEl) ringProgressEl.style.strokeDashoffset = offset;

      if (remainingSeconds === 30 || !isCodeGenerated) {
        const code = await generateTOTP(secretKey);
        if (totpValEl) totpValEl.innerText = code;
        if (copyBtnEl) copyBtnEl.setAttribute("onclick", `copyCodeToClipboard('${code}', this)`);
        isCodeGenerated = true;
      }
    }

    setInterval(() => {
      const remainingSeconds = 30 - (Math.floor(Date.now() / 1000) % 30);
      if (remainingSeconds === 30) {
        isCodeGenerated = false;
      }
      updateTOTPLive();
    }, 1000);

    function buildResultCard() {
      document.getElementById('main-title').innerText = "2FA Code Generator";
      document.getElementById('back-btn').classList.add('show');
      document.getElementById('step-1').classList.remove('active');
      document.getElementById('step-2').classList.add('active');

      const container = document.getElementById('result-card-content');
      container.innerHTML = `
        <div class="totp-display-box">
          <div class="auth-timer-wrapper">
            <svg viewBox="0 0 32 32">
              <circle class="auth-timer-bg" cx="16" cy="16" r="12" fill="none" stroke-width="3"/>
              <circle id="res-ring" class="auth-timer-progress" cx="16" cy="16" r="12" fill="none" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span id="res-timer" class="auth-timer-text">30</span>
          </div>
          <span id="res-totp-val" class="totp-massive-value">------</span>
        </div>
        <button id="res-copy-btn" class="btn-copy-action">
          <span class="copy-icon-circle">${copyOutlineSVG}</span> <span class="copy-btn-text">Copy</span>
        </button>
      `;

      totpValEl = document.getElementById('res-totp-val');
      timerEl = document.getElementById('res-timer');
      ringProgressEl = document.getElementById('res-ring');
      copyBtnEl = document.getElementById('res-copy-btn');

      setTimeout(() => {
        isCodeGenerated = false;
        updateTOTPLive();
      }, 50);
    }
  </script>
</body>
</html>
